name: Deploy NSCC Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted # your EC2-A runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Clean target folder on EC2-B
      - name: Clean target folder on EC2-B
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ec2-user@10.15.1.87 "\
            sudo rm -rf /usr/share/nginx/html/nscc-frontend/* && \
            sudo mkdir -p /usr/share/nginx/html/nscc-frontend && \
            sudo chown -R ec2-user:ec2-user /usr/share/nginx/html/nscc-frontend \
          "

      # Step 2: Copy files to EC2-B
      - name: Copy files to EC2-B
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -r ./* ec2-user@10.15.1.87:/usr/share/nginx/html/nscc-frontend/

      # Step 3: Restart Nginx on EC2-B
      - name: Restart Nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ec2-user@10.15.1.87 "sudo systemctl restart nginx && echo 'Nginx restarted successfully'"
