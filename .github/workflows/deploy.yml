name: Deploy to EC2

on:
  push:
    branches:
      - main # deploy only on pushes to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Copy files to EC2 using SCP
      - name: Copy nscc-frontend to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "nscc-frontend/*" # folder in your repo
          target: "/var/www/html/nscc-frontend" # folder on EC2

      # 3. Optional: restart web server if needed
      - name: Restart Apache (if needed)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl restart httpd
